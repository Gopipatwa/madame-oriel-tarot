      rafId = requestAnimationFrame(frame);
    }

    function select(i, e) {
      const c = cards[i]; if (c.picked || locked || st.picks.length >= N) return;
      locked = true; c.picked = true;
      const entry = TD.pickCard(st, i, e.clientX, e.clientY, performance.now());
      TD.Audio.pick();
      const fr = c.el.getBoundingClientRect();
      const from = { x: fr.left + fr.width / 2, y: fr.top + fr.height / 2 };
      const slotEl = tray.children[entry.slot], tr = slotEl.getBoundingClientRect();
      const to = { x: tr.left + tr.width / 2, y: tr.top + tr.height / 2 };
      const fly = el("div", "fly cb"); fly.style.width = fr.width + "px"; fly.style.height = fr.height + "px";
      fly.style.transform = `translate(${fr.left}px,${fr.top}px)`; document.body.appendChild(fly);
      c.el.classList.add("gone");
      requestAnimationFrame(() => requestAnimationFrame(() => {
        fly.style.transform = `translate(${to.x - fr.width / 2}px,${to.y - fr.height / 2}px) scale(${tr.width / fr.width},${tr.height / fr.height})`;
        fly.style.opacity = "0.85";
      }));
      TD.FX.pull(from, to, () => { slotEl.classList.add("filled"); fly.remove(); });
      const finished = st.picks.length >= N;
      markNext(); UI.logicDirty();
      if (!finished && st.picks.length % (N > 3 ? 3 : 1) === 0) UI.enqueueSay(st.pool.fork("ack" + st.picks.length).pick(TD.voice.pickAck));
      setTimeout(() => { if (finished) { UI.stopField(); resolve(); } else locked = false; }, 1300);
    }
  });

  /* ------------------------------------------------------------ spread */
  UI.buildSpread = function () {
    const sp = TD.spreads[st.spreadId], spread = $("#spread"), celtic = sp.id === "celtic";
    spread.innerHTML = ""; $("#field").innerHTML = ""; $("#tray").innerHTML = "";
    const W = $("#table").clientWidth, H = celtic ? Math.min(innerHeight * 0.5, 440) : 208, gap = celtic ? 6 : 12;
    const cw = celtic ? Math.min((W - 3 * gap) / 4, (H - 8 - 3 * gap) / 6.8) : Math.min((W - 2 * gap) / 3, (H - 34) / 1.7, 96);
    spread.style.setProperty("--cw", cw.toFixed(1) + "px"); spread.style.setProperty("--gap", gap + "px");
    spread.style.setProperty("--cols", sp.grid.cols); spread.style.setProperty("--rows", sp.grid.rows);
    sp.positions.forEach((pos, i) => {
      const pk = st.picks[i];
      const slot = el("div", "sl" + (pos.cross ? " cross" : "")); slot.dataset.slot = i;
      slot.style.gridColumn = pos.c; slot.style.gridRow = pos.r; slot.style.animationDelay = (i * 0.09) + "s";
      const card = el("div", "card", '<div class="inner"><div class="back"></div><div class="face">' + TD.faceSVG(pk.card, pk.rev) + "</div></div>");
      card.setAttribute("role", "button"); card.tabIndex = 0; card.setAttribute("aria-label", pos.label + " card");
      const open = () => { if (card.classList.contains("flipped")) UI.openCard(i); };
      card.addEventListener("click", open); card.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
      slot.append(card, el("div", "sl-label", esc(pos.label)));
      spread.appendChild(slot);
    });
  };

  UI.revealCard = async function (i) {
    const slot = $('#spread .sl[data-slot="' + i + '"]'), c = st.draw[i];
    if (!slot) return;
    document.querySelectorAll("#spread .sl.speaking").forEach(n => n.classList.remove("speaking"));
    if (c.tone <= -1) TD.Audio.hush(c.tone <= -2 ? 2400 : 1300);
    await UI.sleep(c.tone <= -2 ? 900 : 350);
    slot.querySelector(".card").classList.add("flipped"); slot.classList.add("speaking");
    TD.Audio.flip();
    const r = slot.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
    setTimeout(() => {
      TD.Audio.reveal(c.tone, c.rev);
      TD.FX.burst(x, y, c.tone >= 1 ? 42 : c.tone === 0 ? 270 : 350, c.tone <= -2 ? 30 : 16);
      if (c.tone <= -1) TD.FX.smoke(x, y, 10, c.tone <= -2 ? 350 : 275);
      if (c.tone <= -2 && !UI.reduce) {
        const f = $("#flash"); f.classList.add("on"); setTimeout(() => f.classList.remove("on"), 120);
        UI.app.classList.add("shake"); setTimeout(() => UI.app.classList.remove("shake"), 600);
      }
    }, 450);
    UI.logicDirty();
    await UI.sleep(900);
  };

  /* -------------------------------------------------------- card sheet */
  const sheetCard = $("#sheet-card"), sheetLogic = $("#sheet-logic");
  UI.openCard = function (i) {
    const c = st.draw[i], other = TD.interpret(c.card, !c.rev), pos = c.pos;
    $("#sheet-card-body").innerHTML =
      `<div class="sheet-top"><h2>${esc(c.name)}</h2><button class="tbtn" id="close-card" type="button">Close</button></div>` +
      `<div class="detail-face">${TD.faceSVG(c.card, c.rev)}</div>` +
      `<div><span class="pill">${c.rev ? "Reversed" : "Upright"}</span> <span class="pill">${esc(pos.label)}</span> <span class="pill">${esc(c.tier)}</span></div>` +
      `<p class="kw">${esc(c.keywords.join(", "))}</p><p>${esc(c.text)}</p>` +
      `<p class="hint">In this position, ${esc(pos.label.toLowerCase())}: ${esc(pos.meaning.toLowerCase())}.</p>` +
      `<p class="hint">Had it fallen ${c.rev ? "upright" : "reversed"}: ${esc(other.text)}</p>`;
    sheetCard.hidden = false; $("#close-card").focus();
  };
  const closeAll = () => { sheetCard.hidden = true; sheetLogic.hidden = true; };
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });
  sheetCard.addEventListener("click", e => { if (e.target.closest("#close-card") || e.target === sheetCard) sheetCard.hidden = true; });

  /* ------------------------------------------------------- logic panel */
  UI.openLogic = function () { sheetLogic.hidden = false; renderLogic(); };
  UI.logicDirty = function () { if (!sheetLogic.hidden) renderLogic(); };
  $("#btn-logic").addEventListener("click", UI.openLogic);

  function report() {
    const p = st.pool;
    return {
      entropy: { seed_digest: p.seedHex(), hold_ms: p.holdMs, pointer_moves: p.moves, absorbed_values: p.absorbed, clicks: p.clicks, shuffle_passes: st.passes },
      shuffled_order: st.shuffled ? st.shuffled.map(c => c.id) : null,
      spread: st.spreadId, showcase_draw: st.demo,
      draw: st.draw.map(c => ({ slot: c.slot + 1, position: c.slotKey, id: c.id, name: c.name, reversed: c.rev, tier: c.tier })),
      combos_triggered: st.combos.map(c => ({ id: c.id, flag: c.flag, override: c.override })),
      flags: st.flags,
      variables: (({ name, question, emotion, noun, subject, topic }) => ({ name, question, emotion, noun, subject, topic }))(TD.context(st)),
      cold_reading: { hits: st.hits, misses: st.misses, probes: st.probeLog, outcome_feel: st.outcomeFeel }
    };
  }
  function renderLogic() {
    const p = st.pool, ctx = TD.context(st), keep = $("#sheet-logic").scrollTop;
    const kv = o => '<dl class="kv">' + Object.entries(o).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join("") + "</dl>";
    const draw = st.draw.length ? st.draw : st.picks.map((pk, i) => ({ slot: i, slotLabel: TD.spreads[st.spreadId].positions[i].label, id: pk.card.id, name: pk.card.name, rev: pk.rev, tier: TD.TIERS[String(pk.rev ? pk.card.tone.reversed : pk.card.tone.upright)] }));
    const toggles = `<div class="tg">
      <button class="tbtn ${st.demo ? "on" : ""}" id="t-demo" type="button" aria-pressed="${st.demo}">Showcase draw</button>
      <button class="tbtn ${UI.fast ? "on" : ""}" id="t-fast" type="button" aria-pressed="${UI.fast}">Fast pacing</button>
      <button class="tbtn ${TD.AI.enabled ? "on" : ""}" id="t-ai" type="button" aria-pressed="${TD.AI.enabled}">Live conversation</button>
      <button class="tbtn" id="t-copy" type="button">Copy reading JSON</button></div>
      <p class="why">Showcase draw fixes a three-card reading (The Lovers, The Tower reversed, Three of Swords) so every branch fires. Set it before you pick, or press Ask again.</p>`;
    $("#sheet-logic-body").innerHTML =
      `<div class="sheet-top"><h2>Logic</h2><button class="tbtn" id="close-logic" type="button">Close</button></div>` + toggles +
      `<section><h3>1. Entropy seed</h3><p class="why">The seed comes from your hands (hold time, pointer path, click points), never the clock.</p>${kv({
        "seed digest": p.seedHex(), "hold (ms)": p.holdMs == null ? "not yet" : p.holdMs, "pointer moves": p.moves, "values absorbed": p.absorbed,
        "click points": p.clicks.length ? p.clicks.map(c => `(${c.x},${c.y})`).join(" ") : "none yet", "shuffle passes": st.passes || "not yet" })}</section>` +
      `<section><h3>2. Fisher-Yates order</h3><p class="why">Unbiased shuffle of all 78 cards, several passes. First ten in fan order:</p><div>${st.shuffled ? esc(st.shuffled.slice(0, 10).map(c => c.id).join("  ")) : "not shuffled yet"}</div></section>` +
      `<section><h3>3. Drawn cards</h3><p class="why">Orientation: system true-random bit XOR a bit from your click-seeded generator.</p><div class="scroll"><table><tr><th>#</th><th>position</th><th>id</th><th>card</th><th>facing</th><th>tier</th></tr>${
        draw.length ? draw.map(c => `<tr><td>${c.slot + 1}</td><td>${esc(c.slotLabel)}</td><td>${esc(c.id)}</td><td>${esc(c.name)}</td><td>${c.rev ? "reversed" : "upright"}</td><td>${esc(c.tier)}</td></tr>`).join("") : '<tr><td colspan="6" class="off">nothing drawn yet</td></tr>'}</table></div></section>` +
      `<section><h3>4. Combination checks</h3><p class="why">Rules read the whole draw. "override" rules replace the generic card text at the later card.</p><div class="scroll"><table><tr><th>flag</th><th>value</th><th>rule</th></tr>${
        TD.combos.slice().sort((a, b) => b.priority - a.priority).map(r => { const on = !!st.flags[r.flag]; return `<tr class="${on ? "hit" : "off"}"><td>${esc(r.flag)}</td><td>${on}${r.override ? " (override)" : ""}</td><td>${esc(r.rule)}</td></tr>`; }).join("")}</table></div></section>` +
      `<section><h3>5. Context variables</h3><p class="why">Injected into the script wherever you see {name}, {question}, {emotion}, {subject}.</p>${kv({
        name: ctx.name, question: ctx.question, emotion: ctx.emotion, subject: ctx.subject, "topic detected": ctx.topicId, spread: st.spreadId })}</section>` +
      `<section><h3>6. Cold reading state</h3><p class="why">Yes answers raise rapport. Two No answers make the reader hedge and defer to you.</p>${kv({
        hits: st.hits, misses: st.misses, probes: st.probeLog.length ? st.probeLog.map(x => x.id + ":" + x.answer).join(", ") : "none yet", "outcome feel": st.outcomeFeel || "not asked", "live conversation": TD.AI.ready ? (TD.AI.off ? "declined or unavailable" : TD.AI.enabled ? "on (" + TD.AI.count + " chat turns)" : "switched off") : TD.AI.status, tension: UI.tension.toFixed(2), phase: UI.phase })}</section>` +
      `<section id="json-box" hidden><h3>Reading JSON</h3><textarea id="json-out" class="txt" rows="10" readonly style="font-family:var(--mono);font-size:12px;width:100%"></textarea></section>`;
    $("#sheet-logic").scrollTop = keep;
  }
  sheetLogic.addEventListener("click", e => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.id === "close-logic") sheetLogic.hidden = true;
    else if (b.id === "t-demo") { st.demo = !st.demo; renderLogic(); }
    else if (b.id === "t-fast") { UI.fast = !UI.fast; renderLogic(); }
    else if (b.id === "t-ai") { TD.AI.enabled = !TD.AI.enabled; renderLogic(); }
    else if (b.id === "t-copy") {
      const json = JSON.stringify(report(), null, 2), box = $("#json-box"), ta = $("#json-out");
      box.hidden = false; ta.value = json; ta.focus(); ta.select();
      try { navigator.clipboard.writeText(json).then(() => { b.textContent = "Copied"; }, () => { b.textContent = "Select and copy below"; }); } catch (x) { b.textContent = "Select and copy below"; }
    }
  });
})();

</script>
</body>
</html>
